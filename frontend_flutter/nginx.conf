server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html siempre fresco (nunca cachear), para que los nuevos deploys se reflejen
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Service worker y manifest sin cache, para forzar actualización de la PWA
    location ~* (flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA: redirigir rutas desconocidas a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos (imágenes, fuentes y JS/CSS con hash en el nombre)
    location ~* \.(png|jpg|jpeg|gif|svg|ico|wasm|otf|ttf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
